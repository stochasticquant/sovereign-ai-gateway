# Default configuration for Sovereign AI Gateway.
# Override per environment: development.toml, staging.toml, production.toml.
# All values can also be overridden via environment variables prefixed with GATEWAY_.
# Example: GATEWAY_SERVER__PORT=9090 overrides server.port.

[server]
host = "0.0.0.0"
port = 8080
request_timeout_secs = 30
max_request_body_bytes = 1_048_576  # 1 MB

[database]
url = "postgres://gateway:gateway_dev_password@localhost:5432/sovereign_gateway"
max_connections = 20
min_connections = 2

[providers]
default_provider = "openai"
request_timeout_secs = 60

[firewall]
enabled = true
block_on_detection = false
redaction_mode = "irreversible"  # "irreversible" or "reversible"

[policy]
policy_dir = "./policies"
hot_reload = true

[telemetry]
log_level = "info"
log_format = "json"  # "json" or "pretty"
metrics_enabled = true
# otlp_endpoint = "http://localhost:4317"
